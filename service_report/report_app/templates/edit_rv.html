{% extends 'base.html' %}

{% block title %}Edit Return Visit{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card glass-card shadow-sm p-4">

                <h2 class="text-center mb-4">Edit Return Visit</h2>

                <form method="POST">
                    {% csrf_token %}

                    <div class="form-group mb-3">
                        <label>Name</label>
                        {{ form.name }}
                    </div>

                    <div class="form-group mb-3">
                        <label>Info</label>
                        {{ form.info }}
                    </div>

                    <div class="form-group mb-3">
                        <label>Location</label>
                        {{ form.location }}
                    </div>

                    <div class="form-group mb-3">
                        <label>Phone Number</label>
                        {{ form.phone_number }}
                    </div>

                    <div class="form-group mb-3">
                        <label>Conversation Notes</label>
                        {{ form.conversation_notes }}
                    </div>

                    <div class="form-group mb-3">
                        <label>Next Appointment</label>
                        {{ form.next_appointment }}
                    </div>

                    <div class="d-flex justify-content-between mt-3">
                        <button type="submit" class="btn btn-primary">
                            Update
                        </button>

                        <a href="{% url 'rv_list' %}"
                           class="btn btn-secondary">
                            Cancel
                        </a>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
